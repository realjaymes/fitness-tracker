<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 144" width="360" height="144" role="img" aria-label="Reps in reserve scale: 5 or more left is too easy, stop with 1 to 3 left, 0 left is too far"><title>Reps in reserve scale: 5 or more left is too easy, stop with 1 to 3 left, 0 left is too far</title><style>
.t{font:700 13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422} .h{font:800 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422}
.s{font:400 11px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#5d5464} .m{font:700 11px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422}
.w{font:700 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#ffffff} .k{font:700 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#100a16}
.soft{fill:#efe9f4} .line{stroke:#cfc6d6;fill:none} .ink{fill:#1c1422} .inks{stroke:#1c1422;fill:none}
.acc{fill:#f1de71} .avg{stroke:#eb6834;fill:none} .blue{fill:#2a78d6} .aqua{fill:#1baf7a} .orng{fill:#eb6834}
@media (prefers-color-scheme: dark) {
 .t,.h,.m{fill:#f7f4fa} .s{fill:#bdb4c4} .soft{fill:#271d2f} .line{stroke:#3a2e44}
 .ink{fill:#f7f4fa} .inks{stroke:#f7f4fa} .blue{fill:#3987e5} .aqua{fill:#199e70} .orng{fill:#d95926} .avg{stroke:#f08a5d}
}
</style><text x="0" y="16" class="h" text-anchor="start">How many more good reps could you do?</text><rect x="0" y="32" width="56" height="44" rx="8" class="soft"/><text x="28" y="60" class="m" text-anchor="middle">5+</text><rect x="60" y="32" width="56" height="44" rx="8" class="soft"/><text x="88" y="60" class="m" text-anchor="middle">4</text><rect x="120" y="32" width="56" height="44" rx="8" class="acc"/><text x="148" y="60" class="k" text-anchor="middle">3</text><rect x="180" y="32" width="56" height="44" rx="8" class="acc"/><text x="208" y="60" class="k" text-anchor="middle">2</text><rect x="240" y="32" width="56" height="44" rx="8" class="acc"/><text x="268" y="60" class="k" text-anchor="middle">1</text><rect x="300" y="32" width="56" height="44" rx="8" class="orng"/><text x="328" y="60" class="w" text-anchor="middle">0</text><text x="58" y="94" class="s" text-anchor="middle">Too easy</text><text x="208" y="94" class="m" text-anchor="middle">Stop the set here</text><text x="328" y="94" class="s" text-anchor="middle">Too far</text><text x="0" y="122" class="s" text-anchor="start">This number is your “reps in reserve”. End each set with</text><text x="0" y="137" class="s" text-anchor="start">1 to 3 good reps left. If 5 or more were left, go heavier.</text></svg>
