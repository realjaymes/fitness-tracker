<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 212" width="360" height="212" role="img" aria-label="About 120 grams of protein a day, as four meals of about 30 grams"><title>About 120 grams of protein a day, as four meals of about 30 grams</title><style>
