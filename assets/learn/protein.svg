</style><text x="0" y="16" class="h" text-anchor="start">About 120 g of protein a day</text><circle cx="45" cy="72" r="36" class="soft"/><circle cx="45" cy="72" r="26" class="acc"/><text x="45" y="77" class="k" text-anchor="middle">≈30 g</text><text x="45" y="126" class="t" text-anchor="middle">Breakfast</text><text x="45" y="142" class="s" text-anchor="middle">5 eggs</text><circle cx="135" cy="72" r="36" class="soft"/><circle cx="135" cy="72" r="26" class="acc"/><text x="135" y="77" class="k" text-anchor="middle">≈30 g</text><text x="135" y="126" class="t" text-anchor="middle">Lunch</text><text x="135" y="142" class="s" text-anchor="middle">100 g cooked</text><text x="135" y="156" class="s" text-anchor="middle">chicken</text><circle cx="225" cy="72" r="36" class="soft"/><circle cx="225" cy="72" r="26" class="acc"/><text x="225" y="77" class="k" text-anchor="middle">≈30 g</text><text x="225" y="126" class="t" text-anchor="middle">Snack</text><text x="225" y="142" class="s" text-anchor="middle">Whey scoop</text><text x="225" y="156" class="s" text-anchor="middle">+ 1 egg</text><circle cx="315" cy="72" r="36" class="soft"/><circle cx="315" cy="72" r="26" class="acc"/><text x="315" y="77" class="k" text-anchor="middle">≈30 g</text><text x="315" y="126" class="t" text-anchor="middle">Dinner</text><text x="315" y="142" class="s" text-anchor="middle">2 cups cooked</text><text x="315" y="156" class="s" text-anchor="middle">beans</text><text x="0" y="190" class="s" text-anchor="start">Four meals of about 30 g each. Rough guide: an egg ≈ 6 g,</text><text x="0" y="205" class="s" text-anchor="start">100 g cooked chicken ≈ 30 g, a cup of cooked beans ≈ 15 g.</text></svg>
