<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 182" width="360" height="182" role="img" aria-label="Bench Press: start and end positions"><title>Bench Press: start and end positions</title><style>
.t{font:700 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422} .h{font:800 14px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422} .s{font:400 11px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#5d5464}
.lb{font:700 11px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422} .cap{font:600 10px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#5d5464}
.bo{fill:#1c1422;stroke:#1c1422;stroke-width:2.6;stroke-linejoin:round} .bf{fill:#faf8fc}
.m{fill:#e6dff0;stroke:#1c1422;stroke-width:.8;stroke-linejoin:round} .m.s{fill:url(#hs)} .m.p{fill:#f2b933;stroke-width:1.4}
.hsb{fill:#fbf3c4} .hsl{stroke:#dcae2c;stroke-width:1.5}
.dt path{fill:none;stroke:#1c1422;stroke-width:.6;stroke-linecap:round}
.ld{stroke:#1c1422;stroke-width:.7;fill:none} .dot{fill:#1c1422}
.panel{fill:#f1ecf5} .swp{fill:#f2b933;stroke:#1c1422;stroke-width:1.4} .sws{fill:url(#hs);stroke:#1c1422;stroke-width:.8}

.jd{fill:#f1ecf5} .fhh{fill:#1c1422;stroke:#f1ecf5;stroke-width:1.8}
.hl{fill:none;stroke:#f1ecf5;stroke-linecap:round;stroke-linejoin:round}
.fg{fill:none;stroke:#1c1422;stroke-linecap:round;stroke-linejoin:round}
.fh{fill:#1c1422} .far{opacity:.5}
.eq{fill:#8a7f94;stroke:#1c1422;stroke-width:1} .eqs{fill:none;stroke:#1c1422;stroke-width:1.4;stroke-linecap:round}
.bn{fill:#d9cfe3;stroke:#1c1422;stroke-width:1} .mat{fill:#9fd8c4;stroke:#1c1422;stroke-width:1}
.benc{stroke:#1c1422;fill:none;stroke-linecap:round} .bencf{stroke:#d9cfe3;fill:none;stroke-linecap:round}
.gr{stroke:#8a7f94;stroke-width:1.2;fill:none}
.ar{fill:none;stroke:#eb6834;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round} .arh{fill:#eb6834}
.pill{fill:#f1de71} .pt{font:700 10.5px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#100a16}
.pl{font:700 10px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#5d5464;letter-spacing:.04em}

@media (prefers-color-scheme: dark) {
 .t,.h,.lb{fill:#f7f4fa} .s,.cap{fill:#bdb4c4}
 .bo{fill:#f7f4fa;stroke:#f7f4fa} .bf{fill:#1b1422}
 .m{fill:#33283d;stroke:#f7f4fa} .m.p{fill:#f2b933;stroke:#100a16} .hsb{fill:#3d3520} .hsl{stroke:#d1a22c}
 .dt path{stroke:#f7f4fa} .ld{stroke:#f7f4fa} .dot{fill:#f7f4fa}
