<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 266" width="210" height="266" role="img" aria-label="Leg Raises. Main muscles: abs, hip flexors."><title>Leg Raises. Main muscles: abs, hip flexors.</title><style>
