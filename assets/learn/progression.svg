<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="360" height="230" role="img" aria-label="Add reps at the same weight until every set reaches 12, then add 2.5 kg and go back to 8 reps"><title>Add reps at the same weight until every set reaches 12, then add 2.5 kg and go back to 8 reps</title><style>
.t{font:700 13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422} .h{font:800 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422}
.s{font:400 11px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#5d5464} .m{font:700 11px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422}
.w{font:700 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#ffffff} .k{font:700 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#100a16}
.soft{fill:#efe9f4} .line{stroke:#cfc6d6;fill:none} .ink{fill:#1c1422} .inks{stroke:#1c1422;fill:none}
.acc{fill:#f1de71} .avg{stroke:#eb6834;fill:none} .blue{fill:#2a78d6} .aqua{fill:#1baf7a} .orng{fill:#eb6834}
@media (prefers-color-scheme: dark) {
 .t,.h,.m{fill:#f7f4fa} .s{fill:#bdb4c4} .soft{fill:#271d2f} .line{stroke:#3a2e44}
 .ink{fill:#f7f4fa} .inks{stroke:#f7f4fa} .blue{fill:#3987e5} .aqua{fill:#199e70} .orng{fill:#d95926} .avg{stroke:#f08a5d}
}
</style><text x="0" y="16" class="h" text-anchor="start">When to add weight</text><rect x="0" y="112" width="87" height="56" rx="8" class="soft"/><text x="43" y="132" class="m" text-anchor="middle">30 kg</text><text x="43" y="150" class="m" text-anchor="middle">10 · 9 · 8</text><text x="43" y="184" class="s" text-anchor="middle">Session 1</text><rect x="91" y="90" width="87" height="78" rx="8" class="soft"/><text x="134" y="110" class="m" text-anchor="middle">30 kg</text><text x="134" y="128" class="m" text-anchor="middle">11 · 10 · 9</text><text x="134" y="184" class="s" text-anchor="middle">Session 2</text><rect x="182" y="68" width="87" height="100" rx="8" class="acc"/><text x="225" y="88" class="k" text-anchor="middle">30 kg</text><text x="225" y="106" class="k" text-anchor="middle">12 · 12 · 12</text><text x="225" y="184" class="s" text-anchor="middle">Session 3</text><rect x="273" y="46" width="87" height="122" rx="8" class="blue"/><text x="316" y="66" class="w" text-anchor="middle">32.5 kg</text><text x="316" y="84" class="w" text-anchor="middle">8 · 8 · 8</text><text x="316" y="184" class="s" text-anchor="middle">Session 4</text><text x="0" y="208" class="s" text-anchor="start">Same weight, add reps. When every set hits 12, add the</text><text x="0" y="223" class="s" text-anchor="start">smallest jump (2.5 kg on a barbell) and go back to 8.</text></svg>
