<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" width="360" height="190" role="img" aria-label="Your week: strength on Monday, Wednesday and Friday, walks on Tuesday, Thursday and Saturday, rest on Sunday"><title>Your week: strength on Monday, Wednesday and Friday, walks on Tuesday, Thursday and Saturday, rest on Sunday</title><style>
.t{font:700 13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422} .h{font:800 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422}
.s{font:400 11px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#5d5464} .m{font:700 11px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422}
.w{font:700 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#ffffff} .k{font:700 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#100a16}
.soft{fill:#efe9f4} .line{stroke:#cfc6d6;fill:none} .ink{fill:#1c1422} .inks{stroke:#1c1422;fill:none}
.acc{fill:#f1de71} .avg{stroke:#eb6834;fill:none} .blue{fill:#2a78d6} .aqua{fill:#1baf7a} .orng{fill:#eb6834}
@media (prefers-color-scheme: dark) {
 .t,.h,.m{fill:#f7f4fa} .s{fill:#bdb4c4} .soft{fill:#271d2f} .line{stroke:#3a2e44}
 .ink{fill:#f7f4fa} .inks{stroke:#f7f4fa} .blue{fill:#3987e5} .aqua{fill:#199e70} .orng{fill:#d95926} .avg{stroke:#f08a5d}
}
</style><text x="0" y="16" class="h" text-anchor="start">Your week</text><text x="23" y="40" class="s" text-anchor="middle">Mon</text><rect x="0" y="48" width="47" height="46" rx="8" class="blue"/><text x="23" y="76" class="w" text-anchor="middle">A</text><text x="74" y="40" class="s" text-anchor="middle">Tue</text><rect x="51" y="48" width="47" height="46" rx="8" class="aqua"/><text x="74" y="76" class="w" text-anchor="middle">Walk</text><text x="125" y="40" class="s" text-anchor="middle">Wed</text><rect x="102" y="48" width="47" height="46" rx="8" class="blue"/><text x="125" y="76" class="w" text-anchor="middle">B</text><text x="176" y="40" class="s" text-anchor="middle">Thu</text><rect x="153" y="48" width="47" height="46" rx="8" class="aqua"/><text x="176" y="76" class="w" text-anchor="middle">Walk</text><text x="227" y="40" class="s" text-anchor="middle">Fri</text><rect x="204" y="48" width="47" height="46" rx="8" class="blue"/><text x="227" y="76" class="w" text-anchor="middle">C</text><text x="278" y="40" class="s" text-anchor="middle">Sat</text><rect x="255" y="48" width="47" height="46" rx="8" class="aqua"/><text x="278" y="76" class="w" text-anchor="middle">Walk</text><text x="329" y="40" class="s" text-anchor="middle">Sun</text><rect x="306" y="48" width="47" height="46" rx="8" class="soft"/><text x="329" y="76" class="m" text-anchor="middle">Rest</text><text x="0" y="118" class="s" text-anchor="start">Blue: strength session (A, B, C). Green: 20–30 minute walk</text><text x="0" y="133" class="s" text-anchor="start">and 10 minutes of mobility. Steps count every day.</text><rect x="0" y="146" width="360" height="40" rx="8" class="acc"/><text x="12" y="170" class="k" text-anchor="start">A week passes: 2+ strength sessions and 4+ step days</text></svg>
