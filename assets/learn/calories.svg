<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 206" width="360" height="206" role="img" aria-label="Daily calories: resting body 60 to 70 percent, daily movement 15 to 20, workouts 10 to 15, digesting food 5 to 10"><title>Daily calories: resting body 60 to 70 percent, daily movement 15 to 20, workouts 10 to 15, digesting food 5 to 10</title><style>
.t{font:700 13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422} .h{font:800 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422}
.s{font:400 11px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#5d5464} .m{font:700 11px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1c1422}
.w{font:700 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#ffffff} .k{font:700 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#100a16}
.soft{fill:#efe9f4} .line{stroke:#cfc6d6;fill:none} .ink{fill:#1c1422} .inks{stroke:#1c1422;fill:none}
.acc{fill:#f1de71} .avg{stroke:#eb6834;fill:none} .blue{fill:#2a78d6} .aqua{fill:#1baf7a} .orng{fill:#eb6834}
@media (prefers-color-scheme: dark) {
 .t,.h,.m{fill:#f7f4fa} .s{fill:#bdb4c4} .soft{fill:#271d2f} .line{stroke:#3a2e44}
 .ink{fill:#f7f4fa} .inks{stroke:#f7f4fa} .blue{fill:#3987e5} .aqua{fill:#199e70} .orng{fill:#d95926} .avg{stroke:#f08a5d}
}
</style><text x="0" y="16" class="h" text-anchor="start">Where your daily calories go</text><rect x="0.0" y="32" width="226.3" height="36" rx="4" class="blue"/><rect x="228.3" y="32" width="59.5" height="36" rx="4" class="aqua"/><rect x="289.8" y="32" width="41.9" height="36" rx="4" class="orng"/><rect x="333.7" y="32" width="24.3" height="36" rx="4" class="acc"/><rect x="0" y="81" width="12" height="12" rx="3" class="blue"/><text x="20" y="92" class="t" text-anchor="start">Resting body (BMR)</text><text x="360" y="92" class="t" text-anchor="end">60–70%</text><rect x="0" y="103" width="12" height="12" rx="3" class="aqua"/><text x="20" y="114" class="t" text-anchor="start">Daily movement (NEAT)</text><text x="360" y="114" class="t" text-anchor="end">15–20%</text><rect x="0" y="125" width="12" height="12" rx="3" class="orng"/><text x="20" y="136" class="t" text-anchor="start">Workouts (EAT)</text><text x="360" y="136" class="t" text-anchor="end">10–15%</text><rect x="0" y="147" width="12" height="12" rx="3" class="acc"/><text x="20" y="158" class="t" text-anchor="start">Digesting food (TEF)</text><text x="360" y="158" class="t" text-anchor="end">5–10%</text><text x="0" y="184" class="s" text-anchor="start">Daily movement is the part you can raise fastest:</text><text x="0" y="199" class="s" text-anchor="start">walking more beats adding another workout.</text></svg>
