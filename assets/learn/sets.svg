}
</style><text x="0" y="16" class="h" text-anchor="start">“3 sets of 10 reps”</text><rect x="0" y="30" width="104" height="64" rx="8" class="soft"/><circle cx="16" cy="50" r="7" class="blue"/><circle cx="34" cy="50" r="7" class="blue"/><circle cx="52" cy="50" r="7" class="blue"/><circle cx="70" cy="50" r="7" class="blue"/><circle cx="88" cy="50" r="7" class="blue"/><circle cx="16" cy="72" r="7" class="blue"/><circle cx="34" cy="72" r="7" class="blue"/><circle cx="52" cy="72" r="7" class="blue"/><circle cx="70" cy="72" r="7" class="blue"/><circle cx="88" cy="72" r="7" class="blue"/><text x="52" y="112" class="t" text-anchor="middle">Set 1</text><text x="116" y="66" class="s" text-anchor="middle">rest</text><rect x="128" y="30" width="104" height="64" rx="8" class="soft"/><circle cx="144" cy="50" r="7" class="blue"/><circle cx="162" cy="50" r="7" class="blue"/><circle cx="180" cy="50" r="7" class="blue"/><circle cx="198" cy="50" r="7" class="blue"/><circle cx="216" cy="50" r="7" class="blue"/><circle cx="144" cy="72" r="7" class="blue"/><circle cx="162" cy="72" r="7" class="blue"/><circle cx="180" cy="72" r="7" class="blue"/><circle cx="198" cy="72" r="7" class="blue"/><circle cx="216" cy="72" r="7" class="blue"/><text x="180" y="112" class="t" text-anchor="middle">Set 2</text><text x="244" y="66" class="s" text-anchor="middle">rest</text><rect x="256" y="30" width="104" height="64" rx="8" class="soft"/><circle cx="272" cy="50" r="7" class="blue"/><circle cx="290" cy="50" r="7" class="blue"/><circle cx="308" cy="50" r="7" class="blue"/><circle cx="326" cy="50" r="7" class="blue"/><circle cx="344" cy="50" r="7" class="blue"/><circle cx="272" cy="72" r="7" class="blue"/><circle cx="290" cy="72" r="7" class="blue"/><circle cx="308" cy="72" r="7" class="blue"/><circle cx="326" cy="72" r="7" class="blue"/><circle cx="344" cy="72" r="7" class="blue"/><text x="308" y="112" class="t" text-anchor="middle">Set 3</text><text x="0" y="140" class="s" text-anchor="start">Each dot is