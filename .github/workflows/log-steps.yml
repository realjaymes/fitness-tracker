# Writes one day's steps into data/log.json. Fired by the fitness-steps Worker (repository_dispatch "log-steps").
# Payload: client_payload.date (YYYY-MM-DD) and client_payload.steps (whole number). Both are validated here again.
name: log-steps

on:
  repository_dispatch:
    types: [log-steps]

permissions:
  contents: write

concurrency:
  group: log-steps
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Log steps with tools/log.py
        env:
          STEPS_DATE: ${{ github.event.client_payload.date }}
          STEPS_COUNT: ${{ github.event.client_payload.steps }}
        run: |
          set -euo pipefail
          [[ "$STEPS_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Bad date"; exit 1; }
          [[ "$STEPS_COUNT" =~ ^[0-9]{1,5}$ ]] || { echo "Bad steps"; exit 1; }
          python3 -c 'import datetime,sys; datetime.date.fromisoformat(sys.argv[1])' "$STEPS_DATE"
          (( 10#$STEPS_COUNT <= 80000 )) || { echo "Steps too high"; exit 1; }
          python3 tools/log.py day "$STEPS_DATE" --steps "$((10#$STEPS_COUNT))"

      - name: Commit and push data/log.json only
        env:
          STEPS_DATE: ${{ github.event.client_payload.date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/log.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "auto-log steps $STEPS_DATE"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep 5
          done
          exit 1
